<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .comment { border-bottom: 1px solid #ddd; padding: 10px 0; margin: 10px 0; }
        .comment-content { margin: 5px 0; }
        .form-group { margin: 20px 0; }
        textarea { width: 100%; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Comments Board</h1>
    
    <div class="form-group">
        <form method="POST" action="/comments">
            <textarea name="comment_text" rows="4" placeholder="Write your comment here..."></textarea>
            

            <button type="submit">Send Comment</button>
        </form>
    </div>

    <hr>

    <h2>Previous Comments:</h2>
    <div id="comments-list">
        {% if comments %}
            {% for comment in comments %}
                <div class="comment">
                    <div class="comment-content">{{ comment | safe }}</div>
                </div>
            {% endfor %}
        {% else %}
            <p>No comments yet. Be the first!</p>
        {% endif %}
    </div>
</body>
</html>
